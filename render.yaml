# render.yaml — Blueprint de despliegue del backend Mirach (ADR-004).
#
# Despliega apps/api (Express — ADR-028) como Web Service en Render, apuntando
# a la BD Supabase (ADR-002). El frontend web/mobile NO se despliegan aquí.
#
# Cómo usarlo:
#   1. En Render → New → Blueprint → conectar el repo Juargo/mirach.
#   2. Render lee este archivo y crea el servicio.
#   3. Cargar a mano en el dashboard TODO lo declarado con `sync:false`:
#        Obligatorias — sin ellas el servicio NO arranca (env.ts, ADR-029):
#          DATABASE_URL, DIRECT_URL, API_KEY, ENCRYPTION_KEY
#        Opcionales — su ausencia APAGA la feature en silencio, sin error:
#          GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (login web, all-or-nothing)
#          GOOGLE_REDIRECT_URI (obligatoria, https, si el par de arriba está)
#          GOOGLE_CLIENT_ID_ANDROID, GOOGLE_CLIENT_ID_IOS (login mobile; basta uno,
#          gate independiente del web)
#          APPLE_BUNDLE_ID (login con Apple nativo; gate independiente de Google)
#
# Seguridad: ningún `sync:false` se commitea con valor — se cargan a mano en el
# dashboard de Render. API_KEY protege todos los endpoints salvo el health check
# (apiKeyMiddleware, fail-closed).
#
# La fuente de verdad de qué variables existen y cuáles son obligatorias es el
# schema de Zod en `apps/api/src/config/env.ts` (ADR-029), no este archivo. Este
# blueprint debe declarar todo lo que el servicio real tiene seteado: si sabe
# menos que la realidad, deja de servir como artefacto de recuperación (#587).
# NO declarar `ALLOW_DESTRUCTIVE_DB`: env.ts la PROHIBE en producción (el boot
# falla si está presente). `PORT` la inyecta Render; `LOG_LEVEL` tiene default.

services:
  - type: web
    name: mirach-api
    runtime: node
    # Misma región que la BD (Supabase us-east-1): cada request hace varias
    # consultas, así que la latencia API↔BD pesa más que la del cliente.
    region: virginia
    plan: free
    branch: main
    # El repo es un monorepo pnpm; se instala y construye desde la raíz.
    rootDir: .
    # `rm -rf apps/api/dist` runs after Render restores its build cache and
    # before the TypeScript build: it guarantees the deployed dist is exactly what THIS
    # build compiled, never a stale/partial dist left in the cache by a prior
    # (possibly failed) build. A cached dist once shipped without a new route
    # despite the source being correct — this makes the output cache-proof.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      rm -rf apps/api/dist &&
      pnpm --filter @mirach/api exec prisma generate &&
      pnpm --filter @mirach/api build
    startCommand: pnpm --filter @mirach/api start:prod
    # Health check público (ruta Express `GET /`, fuera de /api) — sin API key.
    healthCheckPath: /
    # Hybrid CD (versioning-release-automation, Slice D): rebuild only when
    # something that can affect this service actually changed — a web/landing/
    # mobile-only commit no longer triggers an api deploy. Glob paths are
    # ALWAYS relative to the repo root (monorepo), never to `rootDir` above —
    # verified against Render's live Blueprint spec docs (CONFIRM-AT-APPLY
    # resolved, see apply-progress). `pnpm-lock.yaml`/`pnpm-workspace.yaml`/
    # this file itself stay in `paths` because they can change api's runtime
    # even without touching `apps/api/**`. `ignoredPaths` narrows within an
    # already-matched path (e.g. a `.spec.ts`-only change under `apps/api/`
    # still skips the rebuild).
    buildFilter:
      paths:
        - apps/api/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        # Root files that change how the API is built/secured but live outside
        # apps/api: package.json pins packageManager (the pnpm version corepack
        # resolves in buildCommand); .npmrc holds the supply-chain knobs
        # (minimum-release-age, audit-level — ADR-006/021). A change to either
        # must redeploy, or prod silently keeps running a stale build.
        - package.json
        - .npmrc
        - render.yaml
      ignoredPaths:
        - apps/api/**/*.spec.ts
        - apps/api/test/**
        - apps/api/**/*.md
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
      # ADR-029: env.ts's superRefine only enforces the production rules
      # (COOKIE_SECURE=true, Supabase host, ALLOW_DESTRUCTIVE_DB absent) when
      # NODE_ENV === 'production'. Render does NOT set this implicitly, so it
      # must be explicit here — otherwise the loose 'development' defaults
      # apply in prod (localhost fail-fast off, destructive-DB rule off).
      - key: NODE_ENV
        value: "production"
      # Pooler transaction-mode (IPv4) de Supabase — la app en runtime.
      - key: DATABASE_URL
        sync: false
      # Pooler session-mode — migraciones (Prisma).
      - key: DIRECT_URL
        sync: false
      # API key del ApiKeyGuard. Generar con:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: API_KEY
        sync: false
      # Clave AES-256-GCM que cifra Transaccion.descripcion, numeroCuenta y
      # email en reposo (ADR-013). OBLIGATORIA en todo ambiente: env.ts no la
      # marca opcional, así que sin ella el boot falla — igual que API_KEY.
      # Base64 de 32 bytes EXACTOS. Generar con: openssl rand -base64 32
      # Rotarla sin re-cifrar la BD deja los datos existentes ilegibles.
      - key: ENCRYPTION_KEY
        sync: false
      # Fuerza el flag `Secure` en la cookie de sesión. Con NODE_ENV=production
      # ya seteado arriba, app.ts la deriva igual (cookieSecure = NODE_ENV
      # === 'production' || COOKIE_SECURE) — queda explícita acá como
      # belt-and-suspenders y porque env.ts (ADR-029) exige COOKIE_SECURE=true
      # en producción vía superRefine. Es un valor no secreto.
      - key: COOKIE_SECURE
        value: "true"
      # Rate limiter de login (AUTH-08) — valores por defecto explícitos.
      # El parseo es fail-closed vía env.ts (ADR-029): si alguno queda
      # vacío/no-numérico/≤0, la API no arranca (Zod coerce + superRefine).
      - key: LOGIN_RATELIMIT_MAX_EMAIL
        value: "5"
      - key: LOGIN_RATELIMIT_MAX_IP
        value: "20"
      - key: LOGIN_RATELIMIT_WINDOW_MS
        value: "900000"
      # Cuenta de App Review (ADR-051): único email que puede usar el login por
      # contraseña (POST /api/auth/login). Opcional: sin ella, el login por
      # contraseña se rechaza para todos y /api/auth/capabilities reporta
      # passwordLoginEnabled=false. Setearla en el dashboard solo mientras dure
      # la revisión de App Store; quitarla después de la aprobación.
      - key: REVIEW_LOGIN_EMAIL
        sync: false
      # CORS allowlist (ADR-029): orígenes de navegador autorizados a leer
      # respuestas cross-origin. Las apps nativas no usan CORS y el web está
      # dormido (ADR-046, D5), así que va VACÍA a propósito. Vacía y explícita:
      # si la variable faltara, env.ts caería al default de desarrollo
      # (http://localhost:5173). Es una allowlist EXACTA, jamás "*"; se amplía
      # con coma solo si vuelve un cliente de navegador.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      # Login con Google (ADR-034 web, ADR-035 mobile). Las cinco son
      # OPCIONALES para Zod, y ahí está el riesgo: si faltan, la API arranca
      # perfecto y la feature queda apagada SIN ningún error. Un servicio
      # recreado desde este blueprint se quedaría sin login con Google y nadie
      # se enteraría hasta que un usuario reporte que el botón no está (#587).
      #
      # GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET son all-or-nothing (superRefine
      # en env.ts): exactamente una de las dos presente FALLA el boot, para que
      # un cliente OAuth a medio configurar nunca sea un apagado silencioso.
      #
      # Mirach: el par web y GOOGLE_REDIRECT_URI quedan SIN cargar a propósito
      # (flujo web dormido, ADR-046 D5). GOOGLE_CLIENT_ID_IOS se carga cuando
      # exista el client ID de iOS (la app de iPhone va primero);
      # GOOGLE_CLIENT_ID_ANDROID, cuando exista la app Android.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # URL absoluta del callback. El pathname debe ser EXACTAMENTE
      # /api/auth/google/callback (assertion de boot) y en producción va https.
      # Debe coincidir con lo registrado en Google Cloud Console — eso NO lo
      # valida el boot, se verifica a mano.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Client ID tipo Android para el login mobile nativo (ADR-035). Su gate
      # es TOTALMENTE independiente del par web de arriba (AUTH-22): ausente =
      # login con Google apagado solo en mobile. Ver #586.
      - key: GOOGLE_CLIENT_ID_ANDROID
        sync: false
      # Client ID tipo iOS: Google Sign-In en iPhone emite id_tokens con este
      # client ID como audiencia. Basta uno de los dos (Android o iOS) para
      # prender el login mobile; el verificador acepta los que estén cargados.
      - key: GOOGLE_CLIENT_ID_IOS
        sync: false
      # Bundle ID de la app iOS (p. ej. cl.mirach.app): audiencia (`aud`) que
      # debe llevar el identity token de Sign in with Apple. Activación por
      # presencia — ausente = POST /api/auth/apple/token responde 404 y
      # `appleLoginEnabled` es false. No es un secreto, pero se carga a mano
      # como el resto (depende de la cuenta de Apple Developer). Ver
      # apps/api/docs/apple-sign-in-runbook.md.
      - key: APPLE_BUNDLE_ID
        sync: false
