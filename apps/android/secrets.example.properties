# Copy to secrets.properties (git-ignored) and replace the placeholder with the
# public client key (the API's API_KEY, ADR-047). Never commit the real value.
MIRACH_API_KEY=replace-with-the-api-key

# WEB-type OAuth client ID (Google Cloud > Credentials), used as serverClientId by
# Credential Manager. Optional: leave empty to hide "Continuar con Google". Render's
# GOOGLE_CLIENT_ID_ANDROID must hold this same value (see README).
GOOGLE_WEB_CLIENT_ID=
