name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: paths-filter + checkout only need read. No job in this
# file writes to the repo or opens PRs (that's release-please.yml).
permissions:
  contents: read

jobs:
  # Slice C: path-scoped booleans consumed by every workspace job below, so
  # a PR touching only one workspace doesn't pay for the others. Pinned to a
  # commit SHA (not the mutable @v4 tag) to match the repo's supply-chain
  # posture (ADR-021) — same convention as release-please.yml.
  changes:
    name: Detect changed workspaces
    runs-on: ubuntu-latest
    # dorny/paths-filter lists a PR's changed files via the GitHub API on
    # pull_request events → it needs pull-requests: read. The workflow-level
    # `permissions: contents: read` block sets every unlisted scope to `none`,
    # so this job must re-grant it explicitly (contents: read stays for checkout).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      mobile: ${{ steps.f.outputs.mobile }}
      landing: ${{ steps.f.outputs.landing }}
      packages: ${{ steps.f.outputs.packages }}
      shared: ${{ steps.f.outputs.shared }}
      release-please-config: ${{ steps.f.outputs.release-please-config }}
      openspec: ${{ steps.f.outputs.openspec }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            api:     ['apps/api/**']
            web:     ['apps/web/**']
            mobile:  ['apps/mobile/**']
            landing: ['apps/landing/**']
            packages: ['packages/**']
            # Fail-safe: security/build-relevant ROOT files must trigger the
            # workspace jobs, so a change to them can never skip the secret-scans
            # (fail-open on unlisted root files was the original bug). Listed
            # literally — NOT a `*` catch-all — because picomatch doesn't match
            # dotfiles (e.g. .npmrc) reliably. Only root docs (*.md, LICENSE) may
            # skip; they can't affect build or security.
            shared:  ['pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', '.node-version', '.npmrc', '.lintstagedrc.json', 'commitlint.config.js', 'render.yaml', '.github/workflows/**']
            release-please-config: ['release-please-config.json', '.release-please-manifest.json']
            openspec: ['openspec/changes/**', 'scripts/check-openspec-artifacts.sh']

  # ADR-020: the REAL commit-message enforcement (local husky hooks are
  # --no-verify-skippable, this is not). Runs on every PR/push — NOT
  # path-filtered — commit-message validity is a repo-wide rule, unrelated
  # to which workspace's files changed.
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Validate push commits with commitlint
        # Skip when `before` is the all-zero SHA (new branch / force-push): the
        # range `--from <all-zero>` would fail with a raw git "bad revision"
        # error instead of a clear commit-message failure. On normal pushes to
        # main `before` is the prior tip, so the gate still runs.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from ${{ github.event.before }} --to ${{ github.sha }}

  # NEW (Slice C follow-up from Slice B's review): release-please's own
  # documented failure mode is `release-please-config.json`'s `packages` map
  # drifting out of sync with `.release-please-manifest.json`'s keys — that
  # errors the release-please workflow at run time, not at review time. This
  # job catches the drift in CI instead, on the exact 2 files that can cause
  # it. Deliberately NOT using `release-please debug-config --local` here —
  # that subcommand runs `git reset --hard origin/<default-branch>` against
  # its `--local-path` checkout (see apply-progress topic
  # sdd/versioning-release-automation/apply-progress for the incident this
  # caused during Slice B) — destructive and unnecessary for a key-set check.
  # A plain `jq` comparison is simple (KISS), safe, and sufficient.
  release-please-config-check:
    name: Validate release-please config/manifest key parity
    needs: changes
    if: ${{ needs.changes.outputs.release-please-config == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert packages keys match manifest keys
        run: |
          config_keys=$(jq -r '.packages | keys | sort | join(",")' release-please-config.json)
          manifest_keys=$(jq -r 'keys | sort | join(",")' .release-please-manifest.json)
          echo "release-please-config.json packages keys: $config_keys"
          echo ".release-please-manifest.json keys:        $manifest_keys"
          if [ "$config_keys" != "$manifest_keys" ]; then
            echo "::error::release-please-config.json > packages keys and .release-please-manifest.json keys diverge. This is release-please's documented failure mode (a mismatch errors the release-please workflow at run time). Keep both files' key sets identical."
            exit 1
          fi
          echo "OK: key sets match."

  # US-063 postmortem: US-043 and US-063 both shipped with their
  # `openspec/changes/<name>/` artifacts never `git add`-ed. Four PRs were
  # reviewed against a frozen spec that existed on one laptop and nowhere else.
  #
  # NOTE ON WHAT THIS JOB CAN AND CANNOT DO. It CANNOT catch that case: a CI
  # checkout is a clone, so untracked files do not exist here and any such check
  # would pass vacuously in precisely the situation worth catching. That half
  # lives in `.husky/pre-push`, the only place the signal exists — and per
  # ADR-020 a hook is convenience, not enforcement.
  #
  # What this job DOES catch is the partial commit: a change directory that is
  # in git but missing `tasks.md`, so sdd-apply/sdd-verify and every reviewer
  # cite a contract the repo does not contain. That is fully visible to CI.
  openspec-artifacts:
    name: Validate openspec change artifacts
    needs: changes
    if: ${{ needs.changes.outputs.openspec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert every tracked change carries its required artifacts
        run: ./scripts/check-openspec-artifacts.sh structure

  api:
    name: Typecheck & unit tests (api)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Dummy URLs so prisma.config.ts loads without a real database — its
      # env() calls throw when the variable is missing, so BOTH must be set.
      # No CI step connects to a database (see note on test:integration below).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json > packageManager
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Build scripts run only for packages allowlisted in
      # pnpm-workspace.yaml > allowBuilds; everything else is skipped.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client is not in the allowBuilds allowlist, so its client
      # is never generated on install — generate it explicitly before
      # typechecking or testing the API.
      - name: Generate Prisma client
        run: pnpm api exec prisma generate

      - name: Typecheck API
        run: pnpm api exec tsc --noEmit

      # ESLint gate (ADR-020): hooks are skippable with --no-verify, so CI must
      # re-run lint or the guarantee is illusory. Uses `lint:ci` (no --fix) so
      # this FAILS on violations instead of silently auto-fixing them in the
      # throwaway runner. `recommendedTypeChecked` needs the Prisma client, so
      # this runs after `Generate Prisma client`. Warnings (e.g. the excel
      # no-unsafe-argument ones) do not fail the run by design — only errors do.
      - name: Lint API
        run: pnpm api lint:ci

      # Fail-closed guard (ADR-029, Slice 6): `.env.example` is DERIVED from
      # src/config/env.ts (EnvObjectSchema). If someone adds/removes/renames a
      # schema field without regenerating, this catches the drift before
      # merge — a stale .env.example silently misleads whoever sets up a new
      # environment.
      - name: Check .env.example is up to date
        run: pnpm api env:example:check

      # Fail-closed guard (openapi-contract-express, Slice 0): apps/api/openapi.json
      # is DERIVED from the Zod schemas in http-express/schemas/ via
      # `buildOpenApiDocument()`. If a schema or route changes without
      # re-running `pnpm api openapi:emit`, this catches the drift before
      # merge — same pattern as the .env.example check above. No DB, no
      # container/env — buildOpenApiDocument() is pure (see design).
      - name: Check openapi.json is up to date
        run: pnpm api openapi:check

      # Vitest detecta CI automáticamente vía la env var CI (la setea GitHub
      # Actions) — no necesita un flag equivalente al `--ci` de Jest. En CI eso
      # pone `allowOnly: false` (default de Vitest = `!isCI`), así que un
      # `it.only`/`describe.only` olvidado hace FALLAR el run en vez de reducir
      # el suite en silencio. Localmente `.only` se permite a propósito (debug).
      - name: Unit tests API
        run: pnpm api test

      # Exercises the PRODUCTION build. `tsc -p tsconfig.build.json` uses
      # (rootDir: ./src); the `tsc --noEmit` above uses tsconfig.json (no
      # rootDir), so it does NOT catch rootDir violations (TS6059) — e.g. a
      # src/ file importing a .ts outside src/. This step does. Without it, a
      # build that only Render runs can fail after merge.
      - name: Build API
        run: pnpm api build

      # Integration/e2e run in the dedicated `integration` job below, against an
      # ephemeral Postgres service container — NOT here (this job has no DB).

  # ADR-028/029 — integration + e2e against an EPHEMERAL Postgres. These specs
  # mutate a real DB (gated by ALLOW_DESTRUCTIVE_DB; db-safety blocks prod/
  # Supabase URLs), so they used to be a manual/local-only gate. A throwaway
  # service container on localhost passes the gate, so the money-exactness and
  # user_id-isolation specs (ADR-015) — the two risk concentrations — now run on
  # every PR instead of relying on someone remembering to run them locally.
  # (This closes the ADR-028 debt and is what catches specs bit-rotting silently.)
  integration:
    name: Integration & e2e (api, ephemeral DB)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneydiary
          POSTGRES_PASSWORD: moneydiary
          POSTGRES_DB: moneydiary_test
        ports:
          - 5432:5432
        # GitHub waits for the service to report healthy before running steps.
        options: >-
          --health-cmd "pg_isready -U moneydiary -d moneydiary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Localhost service container → db-safety gate accepts it (not prod/supabase).
      DATABASE_URL: postgresql://moneydiary:moneydiary@localhost:5432/moneydiary_test
      DIRECT_URL: postgresql://moneydiary:moneydiary@localhost:5432/moneydiary_test
      ALLOW_DESTRUCTIVE_DB: '1'
      # Test-only values (localhost DB, throwaway) — NOT secrets. The scripts set
      # DOTENV_CONFIG_PATH=.env.test, which is absent in CI; dotenv tolerates the
      # missing file and never overrides these already-set process.env vars.
      API_KEY: local-ci-api-key-not-a-secret-0000000000
      COOKIE_SECURE: 'false'
      LOGIN_RATELIMIT_MAX_EMAIL: '5'
      LOGIN_RATELIMIT_MAX_IP: '20'
      LOGIN_RATELIMIT_WINDOW_MS: '900000'
      SEED_USER_EMAIL: test@moneydiary.local
      SEED_USER_PASSWORD: local-ci-password-123
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm api exec prisma generate

      # ADR-013: `descripcion` is encrypted at rest — app + specs need a valid
      # 32-byte AES key. Generated fresh per run (never hardcoded), exported to
      # the job env so later steps pick it up.
      # `::add-mask::` ANTES de exportarla: sin eso el valor aparece en claro en
      # el bloque `env:` del log de cada step posterior, mientras los secrets de
      # al lado salen como `***`. La clave es efímera y de test —se genera por
      # corrida para la BD desechable, no descifra nada real— pero una clave de
      # cifrado legible en los logs de un repo se lee como incidente aunque no
      # lo sea, y normaliza el patrón para el día que el valor sí importe.
      - name: Generate test ENCRYPTION_KEY
        run: |
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Migrate + seed the ephemeral DB
        run: pnpm api test:db:setup

      - name: Integration tests (persistence vs real DB)
        run: pnpm api test:integration

      - name: E2E tests (HTTP vs real DB)
        run: pnpm api test:e2e

  # ADR-021 — DAST layer, BLOQUEANTE desde 2026-09-04. Boots the REAL built API against
  # an ephemeral Postgres (clone of `integration`'s service+env) and scans it
  # with Schemathesis (authenticated, read-only property fuzzing against
  # apps/api/openapi.json — the real-value part of this slice) + OWASP ZAP
  # baseline (passive scan of the actual running surface). `continue-on-error:
  # true` at both the job and scanner-step level: DAST is new/noisy per
  # ADR-021's own triage-before-block posture, so it reports without blocking
  # merges while its signal is tuned (`.zap/rules.tsv`). Deliberately included
  # in `ci-success`'s `needs` below — GitHub reports a `continue-on-error`
  # job's result as `success` to dependents even when it internally failed, so
  # this job stays VISIBLE in the checks list without ever failing
  # `ci-success`. Active scan + write-fuzzing deferred to a separate scheduled
  # workflow (slice 2, not built yet).
  dast:
    name: DAST (Schemathesis + ZAP)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneydiary
          POSTGRES_PASSWORD: moneydiary
          POSTGRES_DB: moneydiary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneydiary -d moneydiary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://moneydiary:moneydiary@localhost:5432/moneydiary_test
      DIRECT_URL: postgresql://moneydiary:moneydiary@localhost:5432/moneydiary_test
      ALLOW_DESTRUCTIVE_DB: '1'
      API_KEY: local-ci-api-key-not-a-secret-0000000000
      COOKIE_SECURE: 'false'
      LOGIN_RATELIMIT_MAX_EMAIL: '5'
      LOGIN_RATELIMIT_MAX_IP: '20'
      LOGIN_RATELIMIT_WINDOW_MS: '900000'
      SEED_USER_EMAIL: test@moneydiary.local
      SEED_USER_PASSWORD: local-ci-password-123
      NODE_ENV: test
      PORT: '3000'
      API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Schemathesis runs via `uvx` (not a pnpm dependency — Python tooling).
      # Installed via the official installer script rather than a third-party
      # GitHub Action: this repo pins every third-party action to a commit SHA
      # (ADR-021 supply-chain posture) and a fresh SHA for a brand-new action
      # couldn't be verified this session (no web/Context7 access) — the
      # official install script is the safer choice over an unverified pin.
      - name: Install uv (for Schemathesis via uvx)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Prisma client
        run: pnpm api exec prisma generate

      # ADR-013: `descripcion` is encrypted at rest — fresh 32-byte AES key
      # per run, same pattern as the `integration` job above.
      # `::add-mask::` ANTES de exportarla: sin eso el valor aparece en claro en
      # el bloque `env:` del log de cada step posterior, mientras los secrets de
      # al lado salen como `***`. La clave es efímera y de test —se genera por
      # corrida para la BD desechable, no descifra nada real— pero una clave de
      # cifrado legible en los logs de un repo se lee como incidente aunque no
      # lo sea, y normaliza el patrón para el día que el valor sí importe.
      - name: Generate test ENCRYPTION_KEY
        run: |
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Migrate + seed the ephemeral DB
        run: pnpm api test:db:setup

      # Scans the PRODUCTION build (`start:prod`), not `tsx start` — same
      # rationale as the `api` job's "Build API" step: closest to what Render
      # actually runs.
      - name: Build API
        run: pnpm api build

      - name: Start API (production build) in the background
        run: nohup pnpm api start:prod > api-dast.log 2>&1 &

      # Combines the readiness-poll (GET / health, public, no api-key) with
      # the login pre-step (POST /api/auth/login, seeded CI user) into one
      # script: apps/api/scripts/dast-readiness.ts (untested I/O wrapper)
      # calls the unit-tested extractLoginToken helper
      # (src/infrastructure/http-express/dast/extract-login-token.ts). Prints
      # ONLY the bearer token to stdout; masked immediately below, before it
      # can appear in any subsequent log line.
      - name: Wait for API readiness and obtain a DAST auth token
        id: auth
        run: |
          TOKEN=$(pnpm --silent api dast:token)
          STATUS=$?
          if [ $STATUS -ne 0 ] || [ -z "$TOKEN" ]; then
            echo "::error::Failed to obtain a DAST auth token (readiness or login failed)."
            cat api-dast.log || true
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # DAST-only copy of the committed contract with a `servers` block added
      # so scanners know where to send requests. apps/api/openapi.json
      # intentionally has NO `servers` block (host varies by env — see
      # design); the COMMITTED file is never modified, so the `openapi:check`
      # drift gate in the `api` job above stays meaningful. This copy is
      # discarded with the runner.
      - name: Build a DAST-only OpenAPI copy (adds servers; committed contract untouched)
        run: |
          jq '. + {"servers": [{"url": "http://localhost:3000"}]}' apps/api/openapi.json > openapi-dast.json

      # Schemathesis — the real-value part of slice 1: AUTHENTICATED
      # (x-api-key + bearer), read-only (`--include-method GET`). Verified
      # locally (Vitest not involved — a direct `uvx` run) that Schemathesis
      # v4's filter flags take exactly ONE value each: a comma-separated
      # `--exclude-method POST,PUT,PATCH,DELETE` is silently treated as one
      # non-matching value and selects ALL operations instead of narrowing
      # them — the design's original assumption. `--include-method GET` is
      # the verified, unambiguous alternative. `not_a_server_error` +
      # `response_schema_conformance` catch unexpected 5xxs and contract
      # drift. The trailing check guards against a silent empty-suite pass
      # (also verified locally: a misconfigured filter/schema exits 0 with
      # zero test cases run — "Empty test suite" — which would otherwise look
      # like a clean scan).
      # `uvx schemathesis@4.24.3` fija SOLO schemathesis: sus dependencias
      # transitivas resuelven libres, y una de ellas rompió el escaneo en
      # silencio. jsonschema-rs 0.50.0 (2026-08-20) retiró
      # `CanonicalSchema.is_satisfiable()`, que schemathesis 4.24.3 invoca en
      # `specs/openapi/_hypothesis.py:921` al generar parámetros. Resultado:
      # AttributeError en toda operación con parámetros, fase Fuzzing bloqueada
      # y 7 de 15 operaciones sin escanear — con el job igual en verde, porque
      # el `continue-on-error` se tragaba el exit 1.
      #
      # Frontera verificada reproduciendo local contra el openapi.json commiteado:
      # jsonschema-rs 0.49.9 OK · 0.50.0 roto. Subir schemathesis NO alcanza: la
      # última (4.25.2, 2026-08-24) declara el mismo rango abierto y resuelve
      # igual a la versión rota. Retirar el pin cuando schemathesis publique una
      # versión compatible con jsonschema-rs >=0.50.
      - name: Schemathesis (authenticated, read-only property fuzzing)
        run: |
          set +e
          uvx --with 'jsonschema-rs<0.50' schemathesis@4.24.3 run apps/api/openapi.json \
            --url "$API_BASE_URL" \
            --header "x-api-key: $API_KEY" \
            --header "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            --checks not_a_server_error,response_schema_conformance \
            --include-method GET \
            2>&1 | tee schemathesis-dast.log
          RUN_STATUS="${PIPESTATUS[0]}"
          set -e
          if grep -q "Empty test suite" schemathesis-dast.log || grep -Eq "Selected: 0/" schemathesis-dast.log; then
            echo "::error::Schemathesis selected/tested zero operations — this would be a silent no-op scan."
            exit 1
          fi
          # Malfunción del scanner != hallazgo. Un `Runtime Error` significa que
          # la herramienta se rompió (típicamente una dep transitiva que cambió
          # de API), así que la operación NO se escaneó: el verde sería vacío.
          # Se anota como ::error:: para que quede visible aunque el job siga
          # siendo advisory. Los hallazgos reales viven en RUN_STATUS.
          if grep -q "Runtime Error" schemathesis-dast.log; then
            COUNT=$(grep -c "Runtime Error" schemathesis-dast.log)
            echo "::error::Schemathesis falló con $COUNT Runtime Error(s): el scanner se rompió, NO son hallazgos. Esas operaciones quedaron sin escanear — revisar deps transitivas (ver el pin de jsonschema-rs arriba)."
            exit 1
          fi
          exit "$RUN_STATUS"

      # ZAP baseline (PASSIVE only) — deliberately UNAUTHENTICATED for slice 1.
      # The design flagged two wrinkles for an authenticated ZAP run: (1) this
      # action injects only ONE custom header natively (env
      # ZAP_AUTH_HEADER/_VALUE) — two headers (x-api-key + Bearer) need ZAP's
      # `replacer.full_list` -z config keys; (2) apps/api/openapi.json has no
      # `servers` block. Wrinkle (2) is solved above with a verified, standard
      # OpenAPI mechanism (the generated copy's `servers` entry). Wrinkle (1)
      # stayed UNVERIFIED against live ZAP docs this session (no Context7/web
      # access) — its failure mode is a SILENT misconfiguration (the header
      # quietly never gets applied) rather than a loud one, which is worse
      # than an honestly-narrower scan. So for slice 1, ZAP scans the real,
      # running, unauthenticated surface (security headers, error handling,
      # and passive checks on every endpoint — most will legitimately 401);
      # authenticated business-logic coverage is Schemathesis's job above.
      # Promoting ZAP to authenticated + active scan is tracked as a slice 2
      # follow-up alongside the scheduled full-scan workflow.
      # Pinned to a commit SHA per ADR-021's supply-chain posture (same as
      # `dorny/paths-filter`/`gitleaks-action` above). SHA resolved from tag
      # v0.10.0 via `gh api repos/zaproxy/action-api-scan/commits/v0.10.0`.
      - name: ZAP baseline scan (passive, unauthenticated, advisory)
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: openapi-dast.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-J zap-report.json'
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guards against a silently-no-op ZAP run (e.g. it never actually
      # reached the target file/host). A valid report with a `site` entry
      # proves ZAP sent requests against our host, independent of how many
      # alerts fired (a fully-401'd surface may legitimately have few/none).
      - name: Verify ZAP actually scanned the target
        if: always()
        run: |
          if [ ! -s zap-report.json ]; then
            echo "::error::ZAP produced no report file — treat as a no-op run, not a clean scan."
            exit 1
          fi
          jq -e '.site | length > 0' zap-report.json > /dev/null || {
            echo "::error::ZAP report has no scanned site entries — treat as a no-op run."
            exit 1
          }
          echo "ZAP scanned $(jq -r '.site[0]["@host"]' zap-report.json)."

      # El step de ZAP corre con `fail_action: false` A PROPOSITO: la accion
      # falla ante WARN igual que ante FAIL, y ADR-021 es explicito en que
      # moderate/low ADVIERTEN y no bloquean (hoy hay 4 WARN de headers:
      # X-Powered-By, X-Content-Type-Options, CORP y content-types inesperados).
      # Sin este step, ZAP no podria fallar NUNCA y su aporte al gate seria
      # decorativo. Aca se separa severidad: solo High bloquea.
      #
      # riskcode en el reporte de ZAP: 3=High, 2=Medium, 1=Low, 0=Info.
      - name: Gate on ZAP High-risk alerts
        if: always()
        run: |
          HIGH=$(jq '[.site[]?.alerts[]? | select((.riskcode // "0") | tonumber >= 3)] | length' zap-report.json)
          echo "ZAP High-risk alerts: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            jq -r '.site[]?.alerts[]? | select((.riskcode // "0") | tonumber >= 3)
                   | "  [\(.riskdesc)] \(.name) — \(.instances | length) instancia(s)"' zap-report.json
            echo "::error::ZAP encontro $HIGH alerta(s) de riesgo High. Bloquea el merge (ADR-021)."
            exit 1
          fi

  # api-client-package Slice 1 — CI drift gate for the generated contract
  # types. `types.gen.ts` is committed (design.md "Drift gates in CI"), so
  # this mirrors `pnpm api openapi:check`: regenerate against the committed
  # `apps/api/openapi.json`, then fail if the committed file diverges.
  # Triggers on `api` too because a contract edit changes this gate's INPUT.
  api-client:
    name: Typecheck & contract-drift (api-client)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate contract types
        run: pnpm api-client generate

      - name: Fail if types.gen.ts is stale
        run: |
          git diff --exit-code -- packages/api-client/src/types.gen.ts \
            || { echo "::error::types.gen.ts is out of date. Run 'pnpm api-client generate' and commit."; exit 1; }

      - name: Typecheck api-client
        run: pnpm api-client typecheck

  web:
    name: Typecheck & unit tests (web)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm web typecheck

      # ESLint gate (ADR-020): same rationale as the API lint step. web's `lint`
      # is `eslint .` (no --fix, already a pure check); `dist` is ignored via
      # globalIgnores and the generated routeTree.gen.ts (from `tsr generate` in
      # the typecheck step above) ships an /* eslint-disable */ header.
      - name: Lint web
        run: pnpm web lint

      - name: Unit tests web
        run: pnpm web test

      # Needed so `apps/web/dist/` exists for the secret-scan step below.
      - name: Build web
        run: pnpm web build

      # Fail-closed guard for the `apps/web` secret boundary (Tarea 0-W):
      # the API key must be injected server-side only (Vite dev proxy /
      # Vercel function), never bundled into client code.
      - name: Web secret-scan (fail on bundled API key)
        run: |
          ! grep -rEni 'VITE_.*(KEY|SECRET|TOKEN)' apps/web/src
          test -d apps/web/dist
          ! grep -rEn 'x-api-key' apps/web/dist

  # NEW job (US-063 D-11/D-12) — the ONLY acceptance layer for the M2/M3
  # mobile-viewport work: D-08 chose CSS-only responsive behaviour, so
  # `pnpm web test` (jsdom, no layout engine) cannot assert any of it as a
  # user-visible outcome (design.md §1.4). A SEPARATE job from `web`, not
  # extra steps appended to it — a geometry failure must be distinguishable
  # at a glance from a unit failure, and the Chromium download must not
  # slow that job's fast gate. Same path filter as `web` (this suite lives
  # entirely under `apps/web/e2e`).
  #
  # ⚠️ Hand-off (maintainer decision D-B, US-063 tasks.md task 7): this job
  # is delivered here as a workflow addition ONLY. Making it a BLOCKING
  # required status check on `main`'s branch protection is a repository-
  # admin action (ADR-030 C.7) that cannot be performed from a PR — it is
  # NOT yet enforced by this change. The maintainer must add "E2E
  # (Playwright, web)" to the required-checks list before US-063 PR #2
  # merges; until that happens, this job is informational only, exactly
  # like every other check in this file that is not yet required.
  web-e2e:
    name: E2E (Playwright, web)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache key follows the RESOLVED `@playwright/test` version, not the
      # lockfile hash — the browser binaries this step downloads are tied
      # to that exact version, so it is the correct invalidation signal.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      # On a cache hit the browser binary is already present — only the OS
      # packages (`install-deps`) still need to be (re)applied on a fresh
      # runner image. On a miss, `install --with-deps` does both in one
      # step. Chromium only (design.md D-11): every criterion here is a
      # layout fact of one CSS engine.
      - name: Install Chromium browser (Playwright)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @moneydiary/web exec playwright install --with-deps chromium

      - name: Install Chromium's OS dependencies (Playwright, cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @moneydiary/web exec playwright install-deps chromium

      - name: E2E tests (web, Chromium, 3 viewport projects)
        run: pnpm web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # NEW job (ADR-017) — jest-expo/RNTL had no CI job before this slice.
  mobile:
    name: Typecheck & unit tests (mobile)
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter @moneydiary/mobile exec tsc --noEmit

      # ESLint gate (ADR-020): parity with api/web. Base is eslint-config-expo
      # (Expo's idiomatic RN/React ruleset) plus Prettier via
      # eslint-plugin-prettier. `lint` is `eslint .` (pure check, no --fix).
      # Warnings do not fail the run by design — only errors do. Needs ESLint 9
      # (eslint-config-expo 57 pulls eslint-plugin-react, which predates the
      # ESLint 10 rule-context API).
      - name: Lint mobile
        run: pnpm --filter @moneydiary/mobile lint

      - name: Unit tests mobile
        run: pnpm --filter @moneydiary/mobile test

  landing:
    name: Typecheck & build landing
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck landing
        run: pnpm landing exec astro check
      - name: Build landing
        run: pnpm landing build

      # Scan the production bundle for leaked secrets. If any of these patterns
      # appear in the static output, the build is compromised — fail the job.
      - name: Secret grep
        run: '! grep -rE "(API_KEY|DATABASE_URL|-----BEGIN)" apps/landing/dist/ -q || { echo "Secret found in bundle!"; exit 1; }'

      # Smoke test: serve the built dist/ locally and verify 200.
      # Header-specific assertions (CSP, HSTS, nosniff) are NOT tested here —
      # Vercel applies those at the edge from vercel.json, so they only appear
      # on a real Vercel deployment (preview or production).
      - name: Smoke test
        run: |
          cd apps/landing/dist/ && python3 -m http.server 8787 &
          SERVER_PID=$!
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/)
          kill $SERVER_PID 2>/dev/null || true
          [ "$STATUS" = "200" ] || { echo "Smoke test failed: got $STATUS"; exit 1; }

      # DEPLOYED (deferred — requires LHCI token setup):
      #   - Lighthouse CI (perf >=90, a11y >=95) via @lhci/cli
      #   - axe-core a11y audit via @axe-core/cli
      # These require a Vercel preview URL and LHCI token configured in GitHub
      # secrets. Enable when the deployment pipeline is in place.
      # Relevant env vars: LHCI_GITHUB_APP_TOKEN, VERCEL_PREVIEW_URL

  # ADR-021 — SCA + secretos. Repo-wide (NO path-filtered, como commitlint):
  # una vuln o un secreto filtrado son riesgos de todo el repo, no de un
  # workspace. Bloquea (fail-closed).
  security:
    name: Security (audit + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks diffea el rango del PR / push — necesita el historial.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SCA: falla ante vulns high/critical NUEVAS. Las preexistentes están
      # baselineadas en pnpm-workspace.yaml > auditConfig.ignoreGhsas (burn-down
      # vía Dependabot). audit-level=high también está en .npmrc; explícito acá.
      #
      # `pnpm audit` sale con exit 1 por DOS causas distintas que el comando no
      # distingue: (a) encontró vulnerabilidades, (b) no pudo consultar el
      # registry. Tratarlas igual convierte una caída de npm en un merge
      # bloqueado sin que haya nada roto (2026-09-04: el endpoint
      # /-/npm/v1/security/advisories/bulk devolvió 503 durante horas y frenó el
      # PR #557 dos veces). Este step las separa:
      #
      #   (a) vulnerabilidades  -> exit 1, el gate de ADR-021 sigue vivo
      #   (b) registry caído    -> reintenta con backoff; si nunca responde,
      #                            degrada a ::warning:: y deja pasar
      #
      # (b) es un degradado ABIERTO deliberado: el job queda verde SIN haber
      # verificado el SCA. No es un pase de seguridad — es preferir que una
      # caída de un tercero no bloquee el trunk, y que el warning quede visible
      # en el summary. Si esto se vuelve frecuente, la respuesta correcta es
      # cachear el feed de advisories, no ampliar el degradado.
      - name: pnpm audit (high/critical gate)
        run: |
          for attempt in 1 2 3; do
            out=$(pnpm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if grep -qiE 'TimeoutError|operation was aborted|ERR_SOCKET|ERR_INVALID_RESPONSE|ECONNRESET|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|socket hang up' <<<"$out"; then
              echo "::warning::pnpm audit no pudo alcanzar el registry de npm (intento $attempt/3)"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 60))
              continue
            fi
            echo "::error::pnpm audit encontró vulnerabilidades high/critical"
            exit 1
          done
          echo "::warning::SCA NO verificado: el registry de npm no respondió tras 3 intentos. Esto NO es un pase de seguridad."

      # Secretos: escaneo de gitleaks. En pull_request escanea SOLO los commits
      # del PR (no re-flaggea secretos históricos ya removidos). Un hallazgo hace
      # exit 1 → falla el job. Pinneado a SHA (posture de supply-chain, ADR-021).
      #
      # Pin deliberado en v2: existe v3 (cambios de config incompatibles) — cuando
      # Dependabot ofrezca el bump mayor, es un skip consciente, no staleness.
      #
      # NO se le da `pull-requests: write` a propósito: el job hereda el
      # `contents: read` del workflow (least-privilege). gitleaks intenta anotar
      # inline el diff del PR; sin ese permiso degrada a un warning y los
      # hallazgos igual FALLAN el build y se reportan en el summary/SARIF (no se
      # ocultan). No ampliamos el scope de un action de terceros sobre código de
      # PR solo por anotaciones inline.
      #
      # ⚠️ Si el repo se muda a una GitHub Organization, gitleaks-action exige
      # el secret GITLEAKS_LICENSE y falla-cerrado (exit 1) ANTES de escanear.
      # Hoy `Juargo` es cuenta User → inerte. Al migrar (ADR-023 multi-cliente),
      # agregar GITLEAKS_LICENSE acá primero.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single stable required check (Slice C). Path-filtered jobs above can be
  # SKIPPED depending on which workspace changed — a branch-protection rule
  # that requires one of THOSE job names directly would hang forever on a PR
  # where that job never runs. This job always runs (`if: always()`) and
  # fails only if a needed job actually FAILED or was CANCELLED — a SKIPPED
  # job (correctly gated off by paths-filter) does not fail the gate.
  ci-success:
    name: CI success
    if: always()
    needs: [changes, commitlint, release-please-config-check, openspec-artifacts, api, integration, dast, api-client, web, web-e2e, mobile, landing, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "A required job failed"; exit 1 ;;
            *) echo "All required jobs passed or were skipped" ;;
          esac
