name: release-please

on:
  push:
    branches: [main]
  # Manual trigger. Release PRs all touch `.release-please-manifest.json`, so
  # merging one leaves the others conflicting on generated files — and
  # `gh pr update-branch` cannot resolve those. Without this, the only way to
  # ask release-please to regenerate them was to push something to `main`,
  # which meant inventing a commit just to unstick the bot (hit 2026-08-15,
  # when merging `landing 0.2.0` left `web`/`mobile` DIRTY with no way out).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (not the mutable @v4 tag) — this step holds
      # contents/pull-requests/issues write, so we match the repo's supply-chain
      # posture (ADR-021). Bump the SHA deliberately when upgrading.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
