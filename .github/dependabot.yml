# ADR-021 — SCA: Dependabot mantiene dependencias y actions al día y abre PRs
# para las vulnerabilidades baselineadas en pnpm-workspace.yaml (burn-down).
# Ecosistema npm sobre pnpm: Dependabot detecta pnpm-lock.yaml automáticamente.
version: 2
updates:
  # Dependencias de todos los workspaces del monorepo + la raíz. Con pnpm
  # workspaces el directorio raíz ya cubre cada paquete: listar además
  # '/apps/api' y '/apps/landing' duplicaba cada PR (uno por directorio).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Agrupar patch/minor reduce el ruido de PRs; los major van sueltos para
    # revisarse uno por uno (pueden romper).
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node queda en la línea 22 (versión de Node del proyecto): una
      # mayor más nueva rompe los tipos de ExcelJS. Ver CLAUDE.md, notas de
      # seguridad.
      - dependency-name: '@types/node'
        versions:
          - '>=23.0.0'
      # TypeScript 7 (el compilador nativo en Go) queda fuera hasta que sus
      # consumidores lo soporten: typescript-eslint 8 acepta `<6.1.0` (también
      # el canary) y @astrojs/check `^5 || ^6`. Quitar este ignore cuando ambos
      # declaren soporte para la 7. Las versiones 5.x y 6.x siguen llegando.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'
    commit-message:
      prefix: chore
      include: scope

  # Las propias GitHub Actions (pinneadas a SHA en los workflows) — Dependabot
  # las repinnea al SHA nuevo cuando sale una versión.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # Agrupar TODAS las actions en UN solo PR (patch/minor/major) en vez de N
    # sueltos: son pocas y viven en los workflows, se revisan juntas. La primera
    # tanda de ADR-021 abrió 5 PRs separados (checkout/setup-node/pnpm/
    # release-please/gitleaks) — esto lo evita a futuro.
    groups:
      github-actions:
        patterns:
          - '*'
    # gitleaks-action: pin deliberado en v2 (v3 es nuevo; para un scanner de
    # seguridad conviene madurez, no ser early-adopter). No ofrecer el major.
    # Ver el comentario del step `gitleaks` en .github/workflows/ci.yml.
    ignore:
      - dependency-name: 'gitleaks/gitleaks-action'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: chore
      include: scope
