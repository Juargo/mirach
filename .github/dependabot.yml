# ADR-021 — SCA: Dependabot mantiene dependencias y actions al día y abre PRs
# para las vulnerabilidades baselineadas en pnpm-workspace.yaml (burn-down).
# Ecosistema npm sobre pnpm: Dependabot detecta pnpm-lock.yaml automáticamente.
version: 2
updates:
  # Dependencias de todos los workspaces del monorepo + la raíz.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/api'
      - '/apps/web'
      - '/apps/mobile'
      - '/apps/landing'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Agrupar patch/minor reduce el ruido de PRs; los major van sueltos para
    # revisarse uno por uno (pueden romper).
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # Las propias GitHub Actions (pinneadas a SHA en los workflows) — Dependabot
  # las repinnea al SHA nuevo cuando sale una versión.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # Agrupar TODAS las actions en UN solo PR (patch/minor/major) en vez de N
    # sueltos: son pocas y viven en los workflows, se revisan juntas. La primera
    # tanda de ADR-021 abrió 5 PRs separados (checkout/setup-node/pnpm/
    # release-please/gitleaks) — esto lo evita a futuro.
    groups:
      github-actions:
        patterns:
          - '*'
    # gitleaks-action: pin deliberado en v2 (v3 es nuevo; para un scanner de
    # seguridad conviene madurez, no ser early-adopter). No ofrecer el major.
    # Ver el comentario del step `gitleaks` en .github/workflows/ci.yml.
    ignore:
      - dependency-name: 'gitleaks/gitleaks-action'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: chore
      include: scope
