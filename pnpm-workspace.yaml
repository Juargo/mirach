packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Forzar versión parcheada de uuid (CVE en exceljs → uuid < 11.1.1)
# js-yaml/fast-uri: CVEs de alta severidad en transitivas de
# @commitlint/cli (ADR-020) — cosmiconfig→js-yaml y config-validator→ajv→fast-uri
overrides:
  uuid: '>=11.1.1'
  # GHSA advisory 2026-08-17: stack exhaustion on recursive object graphs (high).
  # Pulled in via @prisma/config -> prisma; v8 patches it.
  deepmerge-ts: '>=8.0.0'
  # Piso subido a 4.3.1: GHSA-5p4m-2wfm-xmqj (!!omap CPU cuadrático, high)
  js-yaml: '>=4.3.1 <5.0.0'
  fast-uri: '>=3.1.4 <4.0.0'
  # nanoid < 3.3.17: GHSA-28wg-ghj8-5hjv + GHSA-2v37-7h3g-55p8 (high) —
  # transitivo dev de vite/postcss (build tooling, no llega a prod). Acotado
  # a la línea 3.x: postcss requiere nanoid CJS (4+ es ESM-only) y un rango
  # abierto resolvería a 6.x rompiendo el build tooling.
  nanoid: '>=3.3.17 <4.0.0'

# Excepción a la cuarentena de 7 días (minimum-release-age, .npmrc) SOLO para
# parches de seguridad aún dentro de la ventana: nanoid 3.3.17 (2026-08-03,
# bloqueado hasta el 10) y js-yaml 4.3.1 (2026-08-01, bloqueado hasta el 8).
# Retirar las entradas cuando pase la ventana.
minimumReleaseAgeExclude:
  - nanoid
  - js-yaml

# ADR-021 — baseline de vulnerabilidades high preexistentes.
# El gate `pnpm audit --audit-level=high` en CI bloquea vulns high/critical
# NUEVAS; estos advisories ya presentes al introducir el gate quedan
# explícitamente registrados (no silenciados) para que Dependabot los vaya
# resolviendo (bump/override). Burn-down: reducir esta lista a cero.
# NO agregar entradas nuevas sin justificación — el gate existe para eso.
auditConfig:
  ignoreGhsas:
    - GHSA-ph9p-34f9-6g65 # tmp — path traversal (transitivo)
    - GHSA-hmw2-7cc7-3qxx # form-data — CRLF injection (transitivo)
    - GHSA-8hv8-536x-4wqp # astro — reflected XSS via slot name (apps/landing)
    - GHSA-2pvr-wf23-7pc7 # astro — host-header SSRF en error page prerenderizada (apps/landing)
    - GHSA-3jxr-9vmj-r5cp # brace-expansion — DoS expansión exponencial (transitivo de exceljs)
    - GHSA-mh99-v99m-4gvg # brace-expansion — DoS expansión ilimitada (transitivo de exceljs)
    - GHSA-rgw5-rvv9-x895 # brace-expansion — DoS intermedio no acotado (advisory nuevo; transitivo de eslint/typescript-eslint y exceljs, ajeno a ADR-032)
    - GHSA-88fw-hqm2-52qc # hono — CORS refleja cualquier Origin con credenciales (transitivo)
    - GHSA-f88m-g3jw-g9cj # sharp — vulnerabilidades heredadas de libvips (apps/landing)
    - GHSA-r28c-9q8g-f849 # postcss — path traversal en source map (build tooling)
    - GHSA-4cwx-7wf7-3272 # undici — cross-user information disclosure (advisory nuevo; transitivo dev de vitest/jsdom, no llega a prod; ajeno a ADR-033)
    - GHSA-7p8r-x3mc-p8w7 # fast-uri — host confusion via backslash (advisory nuevo; transitivo dev de @commitlint, no llega a prod; ajeno a ADR-033)
    - GHSA-w3rx-r6r6-pgpr # image-size — DoS parser ICNS. Transitivo de metro (bundler Expo); solo mide assets del propio repo, nunca input de usuario. Parche exige salto 1.x→2.x en dep de metro sin cobertura de CI que detecte rotura del bundler — se espera bump upstream (Dependabot)
    - GHSA-5p2g-fcmc-qvqq # image-size — DoS parsers JXL/HEIF. Misma justificación que la entrada anterior
