packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Forzar versión parcheada de uuid (CVE en exceljs → uuid < 11.1.1)
# js-yaml: CVE de alta severidad en transitiva de @commitlint/cli (ADR-020),
# vía cosmiconfig→js-yaml. fast-uri llega por dos caminos: @commitlint/cli→
# config-validator→ajv y, alcanzable en producción, @prisma/client→prisma→
# @prisma/dev→@prisma/streams-local→ajv.
overrides:
  uuid: '>=11.1.1'
  # GHSA advisory 2026-08-17: stack exhaustion on recursive object graphs (high).
  # Pulled in via @prisma/config -> prisma; v8 patches it.
  deepmerge-ts: '>=8.0.0'
  # Piso subido a 4.3.1: GHSA-5p4m-2wfm-xmqj (!!omap CPU cuadrático, high)
  js-yaml: '>=4.3.1 <5.0.0'
  # Piso subido a 3.1.6: GHSA-5jgf-p345-68v8 + GHSA-f65p-4m7j-42xc +
  # GHSA-fph4-wmhf-6fwf + GHSA-jqff-g426-hqxp (host confusion y SSRF, high).
  # Alcanzable desde deps de producción: @moneydiary/api -> @prisma/client ->
  # prisma -> @prisma/dev -> @prisma/streams-local -> ajv -> fast-uri.
  fast-uri: '>=3.1.6 <4.0.0'
  # nanoid < 3.3.17: GHSA-28wg-ghj8-5hjv + GHSA-2v37-7h3g-55p8 (high) —
  # transitivo dev de vite/postcss (build tooling, no llega a prod). Acotado
  # a la línea 3.x: postcss requiere nanoid CJS (4+ es ESM-only) y un rango
  # abierto resolvería a 6.x rompiendo el build tooling.
  nanoid: '>=3.3.17 <4.0.0'

  # --- Burn-down del baseline de ADR-021 (2026-09-04) ---
  # Cada piso retira su(s) advisory(es) de auditConfig.ignoreGhsas. Todos son
  # bumps de patch dentro de la misma línea mayor; los rangos van acotados
  # porque un rango abierto resolvería a la mayor más nueva y rompería a los
  # consumidores transitivos (misma trampa documentada arriba para nanoid).

  # GHSA-ph9p-34f9-6g65 — path traversal vía symlink (high). Transitivo.
  tmp: '>=0.2.6 <0.3.0'
  # GHSA-hmw2-7cc7-3qxx — CRLF injection en el nombre de campo (high).
  form-data: '>=4.0.6 <5.0.0'
  # GHSA-88fw-hqm2-52qc — CORS refleja cualquier Origin con credenciales (high).
  hono: '>=4.12.25 <5.0.0'
  # GHSA-r28c-9q8g-f849 — path traversal en el source map (high). Build tooling.
  postcss: '>=8.5.18 <9.0.0'
  # GHSA-c83g-rgw3-j3cx (memoria sin tope) + GHSA-73wf-gq98-2v4g (escritura de
  # prototipo vía browserslist-stats.json). Transitivo de apps/mobile > expo.
  # 4.28.2 -> 4.28.7 es un patch dentro del mismo minor, no el salto de riesgo
  # que sugería la entrada anterior del baseline.
  browserslist: '>=4.28.7 <5.0.0'
  # GHSA-3jxr-9vmj-r5cp + GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — DoS por
  # expansión no acotada (high). El árbol tiene TRES líneas mayores vivas
  # (1.x de exceljs, 2.x y 5.x de eslint/typescript-eslint), así que cada una
  # lleva su propio piso: un override único las colapsaría a 5.x.
  'brace-expansion@1': '>=1.1.18 <2.0.0'
  'brace-expansion@2': '>=2.1.4 <3.0.0'
  'brace-expansion@5': '>=5.0.9 <6.0.0'
  # GHSA-4cwx-7wf7-3272 — cross-user information disclosure (high). Transitivo
  # dev de vitest/jsdom; no llega a prod, pero el piso es gratis.
  undici: '>=7.29.0 <8.0.0'

# Excepción a la cuarentena de 7 días (minimum-release-age, .npmrc) SOLO para
# parches de seguridad aún dentro de la ventana. Vacía a propósito: las
# entradas de nanoid (ventana vencida el 2026-08-10) y js-yaml (2026-08-08) se
# retiraron el 2026-09-04, tal como pedía esta misma nota. Los pisos de
# `overrides` siguen vigentes; lo que se retira es la dispensa de cuarentena.
minimumReleaseAgeExclude: []

# ADR-021 — baseline de vulnerabilidades high preexistentes.
# El gate `pnpm audit --audit-level=high` en CI bloquea vulns high/critical
# NUEVAS; estos advisories ya presentes al introducir el gate quedan
# explícitamente registrados (no silenciados) para que Dependabot los vaya
# resolviendo (bump/override). Burn-down: reducir esta lista a cero.
# NO agregar entradas nuevas sin justificación — el gate existe para eso.
auditConfig:
  ignoreGhsas:
    - GHSA-8hv8-536x-4wqp # astro — reflected XSS via slot name (apps/landing)
    - GHSA-2pvr-wf23-7pc7 # astro — host-header SSRF en error page prerenderizada (apps/landing)
    - GHSA-f88m-g3jw-g9cj # sharp — vulnerabilidades heredadas de libvips (apps/landing)
    - GHSA-w3rx-r6r6-pgpr # image-size — DoS parser ICNS. Transitivo de metro (bundler Expo); solo mide assets del propio repo, nunca input de usuario. SIN PARCHE UPSTREAM: el advisory cubre <=2.0.2 y 2.0.2 es la última versión publicada (verificado 2026-09-04), así que no hay a dónde subir. Corrige la nota anterior, que decía que el parche exigía un salto 1.x→2.x — 2.x es igual de vulnerable. Solo se retira cuando image-size publique el fix
    - GHSA-5p2g-fcmc-qvqq # image-size — DoS parsers JXL/HEIF. Misma justificación que la entrada anterior (sin parche upstream, no un parche caro)
    - GHSA-3f6p-5ww8-9rcr # mysql2 — downgrade del plugin de auth a mysql_clear_password filtra credenciales en texto plano. Driver MySQL que prisma arrastra como opcional y que este proyecto NO usa: apps/api/prisma/schema.prisma declara provider = "postgresql" (ADR-002). Código inalcanzable en runtime
